name: Deploy v2 to Pages

on:
  push:
    branches: [main]
    paths: ['v2/**']
  workflow_dispatch:
  
permissions:
  contents: read
  pages: write
  id-token: write
  
concurrency:
  group: pages
  cancel-in-progress: true
  
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Disable Jekyll processing (keeps _files / _folders)
      - run: touch "v2/.nojekyll"
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: 'v2'
      - run: npm run build
        working-directory: 'v2'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'v2/dist'
      - id: deployment
        uses: actions/deploy-pages@v4
