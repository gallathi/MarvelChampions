<svg xmlns="http://www.w3.org/2000/svg" width="320" height="60" viewBox="0 0 320 60" role="img" aria-label="Ouvrir le générateur">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f23a40"/>
      <stop offset="1" stop-color="#c91c23"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- relief + corps du bouton -->
  <rect x="2" y="5" width="316" height="53" rx="26.5" fill="#7d0d13"/>
  <rect x="2" y="1" width="316" height="53" rx="26.5" fill="url(#face)"/>
  <rect x="8" y="3" width="304" height="22" rx="11" fill="url(#shine)"/>

  <!-- dé du logo -->
  <g transform="translate(15 8) rotate(-12 19 19)">
    <rect x="5" y="5" width="32" height="32" rx="8" fill="#000" opacity=".4"/>
    <rect x="2" y="2" width="32" height="32" rx="8" fill="#fff" stroke="#111" stroke-width="2.5"/>
    <g fill="#14161c">
      <circle cx="10.5" cy="10.5" r="3.2"/>
      <circle cx="25.5" cy="10.5" r="3.2"/>
      <circle cx="10.5" cy="25.5" r="3.2"/>
      <circle cx="25.5" cy="25.5" r="3.2"/>
    </g>
    <path d="M18 11.6l1.7 3.5 3.8.5-2.8 2.7.7 3.8-3.4-1.8-3.4 1.8.7-3.8-2.8-2.7 3.8-.5z" fill="#f5c518" stroke="#111" stroke-width="1.3" stroke-linejoin="round"/>
  </g>

  <!-- largeur de texte fixée : rendu identique quelle que soit la police système -->
  <text x="166" y="34.5" text-anchor="middle" fill="#fff" textLength="184" lengthAdjust="spacingAndGlyphs"
        font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif"
        font-size="19" font-weight="700" letter-spacing=".2">Ouvrir le générateur</text>

  <!-- flèche -->
  <circle cx="288" cy="27.5" r="15" fill="#fff" fill-opacity=".18"/>
  <path d="M281.5 27.5h12M288.5 22.5l5 5-5 5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
